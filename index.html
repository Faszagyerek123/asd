<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hang és Lélek Stúdió - Ajándékkártya</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f5f0;
            color: #4a4a4a;
            padding: 15px; /* Mobil margó */
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px; /* Kicsit szélesebb a kényelemért */
            border-top: 5px solid #006b12;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #008321;
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1.4rem;
        }
        .status-msg {
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
            color: #888;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 14px; /* Kicsit nagyobb érintési felület mobilra */
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            font-size: 16px; /* 16px felett az iPhone nem zoomol rá automatikusan */
            background-color: #fff;
        }
        input:focus, select:focus {
            border-color: #0b8600;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #2c8124;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 107, 18, 0.2);
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            margin-bottom: 12px;
            -webkit-appearance: none; /* iOS gomb stílus fix */
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn:hover:not(:disabled) {
            background: #1e7a2a;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #4a4a4a;
            box-shadow: none;
            margin-top: 10px;
        }
        
        /* Mobil specifikus finomítások */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body onload="initPage()">

<div class="container">
    <h2>Hang és Lélek Stúdió</h2>
    <div id="status" class="status-msg">Sablon betöltése folyamatban...</div>

    <div class="form-group">
        <label>AJÁNDÉKOZOTT NEVE:</label>
        <input type="text" id="userName" placeholder="Pl. Kovács Anna">
    </div>

    <div class="form-group">
        <label>SZOLGÁLTATÁS:</label>
        <select id="serviceName">
            <option value="">-- Válassz szolgáltatást --</option>
            <option value="Páros hangfürdő">Páros hangfürdő</option>
            <option value="Anya-Lánya/Fia">Anya-Lánya/Fia</option>
            <option value="Konzultáció">Konzultáció</option>
            <option value="Egyéni hangfürdő">Egyéni hangfürdő</option>
            <option value="Csoportos hangfürdő">Csoportos hangfürdő</option>
            <option value="Egyéni hangtálkezelés">Egyéni hangtálkezelés</option>
            <option value="Gyermek 10-16 éves csoportos hangfürdő">Gyermek 10-16 éves csoportos hangfürdő</option>
            <option value="Egyéni gyermek -szülő">Egyéni gyermek -szülő</option>
            <option value="Baba-mama">Baba-mama</option>
            <option value="Egyéni kisállat hangfürdő">Egyéni kisállat hangfürdő</option>
        </select>
    </div>

    <div class="form-group">
        <label>ÉRVÉNYESSÉG:</label>
        <input type="text" id="expiryDate">
    </div>

    <button class="btn" id="downloadBtn" onclick="generatePDF()" disabled>PDF GENERÁLÁSA ÉS LETÖLTÉSE</button>
    
    <button class="btn btn-secondary" onclick="goToHome()">VISSZA A FŐOLDALRA</button>
</div>

<script>
    let cachedPdfBuffer = null;
    
    // IDE ÍRD BE A PDF SABLONOD NEVÉT! 
    // Fontos: a PDF fájl ugyanabban a mappában legyen, mint ez a HTML!
    const TEMPLATE_URL = 'sablon.pdf'; 

    async function initPage() {
        setExpiryDate();
        await loadTemplate();
    }

    // Sablon automatikus betöltése
    async function loadTemplate() {
        const statusEl = document.getElementById('status');
        try {
            const response = await fetch(TEMPLATE_URL);
            if (!response.ok) throw new Error('A sablon fájl nem található!');
            
            cachedPdfBuffer = await response.arrayBuffer();
            
            statusEl.innerText = "✓ Sablon kész";
            statusEl.style.color = "#2c8124";
            document.getElementById('downloadBtn').disabled = false;
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Hiba: A 'sablon.pdf' nem tölthető be!";
            statusEl.style.color = "red";
        }
    }

    function goToHome() {
        window.location.href = "https://hangeslelekstudio.hu"; 
    }

    function setExpiryDate() {
        const date = new Date();
        date.setMonth(date.getMonth() + 3);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        document.getElementById('expiryDate').value = `${year}. ${month}. ${day}.`;
    }

    async function generatePDF() {
        const name = document.getElementById('userName').value;
        const service = document.getElementById('serviceName').value;
        const expiry = document.getElementById('expiryDate').value;

        if (!name || !service) {
            alert("Kérlek, tölts ki minden mezőt!");
            return;
        }

        try {
            const pdfDoc = await PDFLib.PDFDocument.load(cachedPdfBuffer);
            const pages = pdfDoc.getPages();
            const firstPage = pages[0];
            const { height } = firstPage.getSize();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

            const xPos = 225; 
            const maxSzelesseg = 280; 
            const textColor = PDFLib.rgb(0.2, 0.2, 0.2); 

            // Szöveg ráírása
            firstPage.drawText(name, {
                x: xPos, y: height - 154, size: 18, font: font,
                color: textColor, maxWidth: maxSzelesseg, lineHeight: 20
            });

            firstPage.drawText(service, {
                x: xPos, y: height - 184, size: 14, font: font,
                color: textColor, maxWidth: maxSzelesseg, lineHeight: 16
            });

            firstPage.drawText(expiry, {
                x: xPos, y: height - 210, size: 14, font: font,
                color: textColor, maxWidth: maxSzelesseg
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            const safeName = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
            link.download = `Ajandekkartya_${safeName || 'kartya'}.pdf`;
            link.click();

        } catch (error) {
            console.error(error);
            alert("Hiba történt a PDF generálása során!");
        }
    }
</script>

</body>
</html>
