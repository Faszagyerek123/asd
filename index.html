<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hang és Lélek Stúdió - Ajándékkártya</title>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8f5f0; color: #4a4a4a; padding: 15px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border-top: 5px solid #006b12; box-sizing: border-box; }
        h2 { margin-top: 0; color: #008321; text-align: center; font-weight: 300; letter-spacing: 1px; text-transform: uppercase; font-size: 1.4rem; }
        .status-msg { font-size: 12px; text-align: center; margin-bottom: 20px; color: #888; }
        .form-group { margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: #555; }
        input, select { width: 100%; padding: 14px; box-sizing: border-box; border: 1px solid #e0e0e0; border-radius: 8px; outline: none; transition: border-color 0.3s; font-size: 16px; background-color: #fff; }
        input:focus, select:focus { border-color: #0b8600; }
        .btn { width: 100%; padding: 16px; background: #2c8124; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0, 107, 18, 0.2); text-align: center; text-decoration: none; display: block; box-sizing: border-box; margin-bottom: 12px; -webkit-appearance: none; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #1e7a2a; transform: translateY(-2px); }
        .btn-secondary { background: #f0f0f0; color: #4a4a4a; box-shadow: none; margin-top: 10px; }
    </style>
</head>
<body onload="initPage()">

<div class="container">
    <h2>Hang és Lélek Stúdió</h2>
    <div id="status" class="status-msg">Betöltés...</div>

    <div class="form-group">
        <label>AJÁNDÉKOZOTT NEVE:</label>
        <input type="text" id="userName" placeholder="Pl. Kovács Anna">
    </div>

    <div class="form-group">
        <label>SZOLGÁLTATÁS:</label>
        <select id="serviceName">
            <option value="">-- Válassz szolgáltatást --</option>
            <option value="Páros hangfürdő">Páros hangfürdő</option>
            <option value="Anya-Lánya/Fia">Anya-Lánya/Fia</option>
            <option value="Konzultáció">Konzultáció</option>
            <option value="Egyéni hangfürdő">Egyéni hangfürdő</option>
            <option value="Csoportos hangfürdő">Csoportos hangfürdő</option>
            <option value="Egyéni hangtálkezelés">Egyéni hangtálkezelés</option>
            <option value="Gyermek 10-16 éves csoportos hangfürdő">Gyermek 10-16 éves csoportos hangfürdő</option>
            <option value="Egyéni gyermek -szülő">Egyéni gyermek -szülő</option>
            <option value="Baba-mama">Baba-mama</option>
            <option value="Egyéni kisállat hangfürdő">Egyéni kisállat hangfürdő</option>
        </select>
    </div>

    <div class="form-group">
        <label>ÉRVÉNYESSÉG:</label>
        <input type="text" id="expiryDate">
    </div>

    <button class="btn" id="downloadBtn" onclick="generatePDF()" disabled>PDF GENERÁLÁSA</button>
    <button class="btn btn-secondary" onclick="window.location.href='https://hangeslelekstudio.hu'">VISSZA</button>
</div>

<script>
    let cachedPdfBuffer = null;
    let customFont = null;
    
    // A sablonod neve (legyen ugyanott, ahol ez a fájl!)
    const TEMPLATE_URL = 'sablon.pdf'; 
    // Új, megbízhatóbb Lato-Bold URL
    const FONT_URL = 'Lato-Regular.ttf';

    async function initPage() {
        setExpiryDate();
        await loadAssets();
    }

    async function loadAssets() {
        const statusEl = document.getElementById('status');
        try {
            // 1. Sablon betöltése
            const pdfRes = await fetch(TEMPLATE_URL);
            if (!pdfRes.ok) throw new Error('A sablon.pdf nem található!');
            cachedPdfBuffer = await pdfRes.arrayBuffer();

            // 2. Betűtípus betöltése
            const fontRes = await fetch(FONT_URL);
            if (!fontRes.ok) throw new Error('A betűtípus nem tölthető be!');
            customFont = await fontRes.arrayBuffer();
            
            statusEl.innerText = "✓ Sablon és betűtípus kész";
            statusEl.style.color = "#2c8124";
            document.getElementById('downloadBtn').disabled = false;
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Hiba: " + error.message;
            statusEl.style.color = "red";
        }
    }

    function setExpiryDate() {
        const date = new Date();
        date.setMonth(date.getMonth() + 3);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        document.getElementById('expiryDate').value = `${year}. ${month}. ${day}.`;
    }

    async function generatePDF() {
        const name = document.getElementById('userName').value;
        const service = document.getElementById('serviceName').value;
        const expiry = document.getElementById('expiryDate').value;

        if (!name || !service) {
            alert("Tölts ki minden mezőt!");
            return;
        }

        try {
            const pdfDoc = await PDFLib.PDFDocument.load(cachedPdfBuffer);
            pdfDoc.registerFontkit(fontkit);
            const embeddedFont = await pdfDoc.embedFont(customFont);

            const pages = pdfDoc.getPages();
            const firstPage = pages[0];
            const { height } = firstPage.getSize();
            const textColor = PDFLib.rgb(0.2, 0.2, 0.2); 

            // Szövegek ráírása (koordináták maradtak)
            firstPage.drawText(name, { x: 225, y: height - 154, size: 18, font: embeddedFont, color: textColor });
            firstPage.drawText(service, { x: 225, y: height - 184, size: 14, font: embeddedFont, color: textColor });
            firstPage.drawText(expiry, { x: 225, y: height - 210, size: 14, font: embeddedFont, color: textColor });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Ajandekkartya.pdf`;
            link.click();
        } catch (error) {
            alert("Hiba a generáláskor: " + error.message);
        }
    }
</script>
</body>
</html>
